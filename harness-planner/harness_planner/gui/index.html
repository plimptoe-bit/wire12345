<title>Harness Planner 98</title>
<style>
/* Layout: one classic-theme application window on a teal desktop; folders
   tree left, viewer right. Single-theme by choice: Windows 98 "Classic" is
   the visual world — flat #C0C0C0 chrome, 3D bevels, navy title bar, square
   corners — every color explicit. */
:root{
  --desktop:#008080;
  --chrome:#C0C0C0;
  --face-lt:#DFDFDF;
  --hilite:#FFFFFF;
  --shadow:#808080;
  --dkshadow:#404040;
  --title-a:#000080; --title-b:#1084D0;
  --menu-hi:#000080;
  --paper:#FFFFFF;
  --ink:#000000;
  --ink-soft:#3A3A3A;
  --sel:#000080;
  --ok:#008000; --warn:#A05A00; --bad:#C00000;
  --bevel-out:inset -1px -1px var(--dkshadow),inset 1px 1px var(--hilite),
              inset -2px -2px var(--shadow),inset 2px 2px var(--face-lt);
  --bevel-in: inset -1px -1px var(--hilite),inset 1px 1px var(--dkshadow),
              inset -2px -2px var(--face-lt),inset 2px 2px var(--shadow);
  --bevel-thin-in:inset -1px -1px var(--hilite),inset 1px 1px var(--shadow);
  --bevel-thin-out:inset -1px -1px var(--shadow),inset 1px 1px var(--hilite);
  --etched:inset 1px 1px var(--shadow),inset -1px -1px var(--hilite);
}
html,body{height:100%}
body{
  margin:0;background:var(--desktop);
  color:var(--ink);
  font:11px Tahoma,"MS Sans Serif","Segoe UI",Verdana,sans-serif;
  padding:12px 14px;box-sizing:border-box;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
*{box-sizing:border-box}
::-webkit-scrollbar{width:16px;height:16px;
  background:repeating-conic-gradient(var(--hilite) 0% 25%,var(--chrome) 0% 50%) 0 0/4px 4px}
::-webkit-scrollbar-thumb{background:var(--chrome);box-shadow:var(--bevel-out)}
::-webkit-scrollbar-button:single-button{background:var(--chrome);
  box-shadow:var(--bevel-out);height:16px;width:16px}
#win{
  display:flex;flex-direction:column;height:100%;
  background:var(--chrome);
  box-shadow:var(--bevel-out);
  padding:3px;
  overflow:hidden;min-width:0;
}
body:has(#win.maxi){padding:0;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}

/* ---- title bar ------------------------------------------------------- */
#titlebar{
  flex:0 0 auto;display:flex;align-items:center;gap:5px;
  padding:2px 2px 2px 4px;user-select:none;
  background:linear-gradient(90deg,var(--title-a),var(--title-b));
  color:#fff;font-weight:bold;font-size:11px;
}
#titlebar .ico{width:16px;height:16px;flex:0 0 auto}
#titlebar .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption-btns{display:flex;gap:2px}
.cbtn{
  width:18px;height:16px;border:none;
  color:var(--ink);font:bold 10px Tahoma,sans-serif;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--chrome);box-shadow:var(--bevel-out);
}
.cbtn:active{box-shadow:var(--bevel-in)}
.cbtn.close{margin-left:2px}

/* ---- menu + toolbar --------------------------------------------------- */
#menubar{flex:0 0 auto;display:flex;background:var(--chrome);
  padding:1px 0;user-select:none}
.menu{position:relative}
.menu>button{border:none;background:none;font:inherit;
  padding:3px 9px;cursor:default;color:var(--ink)}
.menu.open>button,.menu>button:hover{background:var(--menu-hi);color:#fff}
.dropdown{position:absolute;left:0;top:100%;z-index:60;min-width:230px;
  background:var(--chrome);box-shadow:var(--bevel-out),2px 2px 0 rgba(0,0,0,.35);
  padding:3px;display:none}
.menu.open .dropdown{display:block}
.mi{display:flex;gap:8px;align-items:center;padding:4px 18px 4px 24px;
  cursor:default;white-space:nowrap;color:var(--ink)}
.mi:hover{background:var(--menu-hi);color:#fff}
.mi.dis{color:var(--shadow);text-shadow:1px 1px 0 var(--hilite)}
.mi.dis:hover{background:none}
.msep{height:2px;margin:3px 2px;box-shadow:var(--etched)}

#toolbar{flex:0 0 auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  padding:4px 4px;background:var(--chrome);box-shadow:var(--etched)}
.tsep{width:2px;align-self:stretch;box-shadow:var(--etched);margin:2px 2px}
.xbtn{
  display:inline-flex;align-items:center;gap:5px;
  font:inherit;color:var(--ink);cursor:pointer;
  padding:4px 11px;border:none;border-radius:0;
  background:var(--chrome);
  box-shadow:var(--bevel-out);
}
.xbtn:active{box-shadow:var(--bevel-in);padding:5px 10px 3px 12px}
.xbtn:focus-visible{outline:1px dotted var(--ink);outline-offset:-5px}
.xbtn:disabled{color:var(--shadow);text-shadow:1px 1px 0 var(--hilite);cursor:default}
.xbtn .bico{width:14px;height:14px}
select.xsel{font:inherit;padding:2px;border:none;background:var(--paper);
  color:var(--ink);max-width:220px;box-shadow:var(--bevel-in)}
label.tl{color:var(--ink)}

/* ---- main area -------------------------------------------------------- */
#main{flex:1 1 auto;display:flex;min-height:0;background:var(--chrome);padding:3px 0 2px}
#sidebar{
  flex:0 0 240px;display:flex;flex-direction:column;min-height:0;
  margin-right:4px;background:var(--paper);box-shadow:var(--bevel-in);
  padding:2px;
}
#sidebar .paneltitle{
  flex:0 0 auto;padding:3px 8px;font-weight:bold;color:var(--ink);
  background:var(--chrome);box-shadow:var(--bevel-thin-out);
}
#tree{flex:1 1 auto;overflow:auto;padding:4px 2px;background:var(--paper)}
.titem{display:flex;align-items:center;gap:5px;padding:2px 6px;white-space:nowrap;cursor:default;color:var(--ink)}
.titem:hover{background:#E4E4E4}
.titem.sel{background:var(--sel);color:#fff;outline:1px dotted #FFFF00;outline-offset:-1px}
.titem .fico{flex:0 0 auto}
.tgroup{margin:6px 4px 1px;font-weight:bold;color:var(--ink);display:flex;gap:5px;align-items:center;cursor:default}
.tgroup .box{width:11px;height:11px;border:1px solid var(--shadow);background:var(--paper);
  font:9px/9px Tahoma;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.tcount{color:var(--shadow);font-weight:normal}

#contentcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
#addressbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;
  padding:2px 2px 4px;background:var(--chrome)}
#addressbar .ad{flex:1 1 auto;display:flex;gap:6px;align-items:center;
  background:var(--paper);box-shadow:var(--bevel-in);padding:3px 6px;min-width:0;color:var(--ink)}
#addressbar .ad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{flex:1 1 auto;overflow:auto;background:var(--paper);
  box-shadow:var(--bevel-in);padding:2px;min-width:0}

/* ---- status bar ------------------------------------------------------- */
#statusbar{flex:0 0 auto;display:flex;gap:3px;padding:3px 0 0;background:var(--chrome)}
.spanel{box-shadow:var(--bevel-thin-in);
  padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.spanel.grow{flex:1 1 auto}
.sdot{display:inline-block;width:8px;height:8px;margin-right:4px}

/* ---- viewer content --------------------------------------------------- */
.vtool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:5px 8px;background:var(--chrome);box-shadow:var(--bevel-thin-out);
  position:sticky;top:0;z-index:5}
.vtool .fname{font-weight:bold}
.vtool .meta{color:var(--ink-soft)}
.doc{padding:14px 18px;max-width:900px;font-size:12px;line-height:1.5;background:var(--paper)}
.doc h1{font-size:16px;margin:4px 0 10px;color:var(--title-a);text-wrap:balance}
.doc h2{font-size:13px;margin:16px 0 6px;color:var(--title-a);border-bottom:1px solid var(--shadow);padding-bottom:2px}
.doc h3{font-size:12px;margin:12px 0 4px}
.doc p{margin:6px 0}
.doc ul{margin:4px 0;padding-left:22px}
.doc li{margin:2px 0}
.doc blockquote{margin:8px 0;padding:6px 10px;background:#FFFFE1;border:1px solid var(--shadow)}
.doc code{font:11px "Lucida Console",Consolas,monospace;background:#E8E8E8;padding:0 3px}
.doc hr{border:none;height:2px;box-shadow:var(--etched)}
.tablewrap{overflow-x:auto;margin:8px 0;border:1px solid var(--shadow)}
table.grid{border-collapse:collapse;font-size:11px;min-width:100%}
table.grid th{background:var(--chrome);box-shadow:var(--bevel-thin-out);text-align:left;
  padding:4px 8px;border-right:1px solid var(--shadow);
  white-space:nowrap;position:sticky;top:0}
table.grid td{padding:3px 8px;border-right:1px solid #E0E0E0;border-bottom:1px solid #E0E0E0;
  vertical-align:top;font-variant-numeric:tabular-nums}
table.grid tr:nth-child(even) td{background:#F0F0F0}
pre.plain{font:11px "Lucida Console",Consolas,monospace;padding:14px 18px;margin:0;white-space:pre-wrap;background:var(--paper)}
.svgwrap{overflow:auto;padding:12px;background:
  repeating-conic-gradient(#D4D4D4 0% 25%,#C8C8C8 0% 50%) 0 0/16px 16px}
.svgwrap svg{background:#fff;border:1px solid var(--dkshadow);max-width:none;display:block}
.sev{display:inline-block;padding:1px 7px;color:#fff;font-weight:bold;font-size:10px}
.sev.blocker{background:var(--bad)} .sev.warning{background:var(--warn)} .sev.info{background:var(--title-a)}
.binmsg{padding:30px;text-align:center;color:var(--ink-soft);background:var(--paper)}

/* home view */
.home{padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-width:980px;background:var(--paper)}
.hcard{border:2px groove var(--face-lt);background:var(--paper);padding:0 0 2px}
.hcard .hhdr{padding:3px 10px;font-weight:bold;color:#fff;
  background:linear-gradient(90deg,var(--title-a),var(--title-b));margin:2px}
.hcard .hbody{padding:10px 12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0}
.cps{display:flex;flex-direction:column;gap:6px}
.cprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cprow .nm{font-weight:bold;min-width:220px}
.badge{padding:1px 8px;font-weight:bold;font-size:10px;color:#fff}
.badge.ok{background:var(--ok)} .badge.pend{background:var(--warn)}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.cnt{background:var(--paper);box-shadow:var(--bevel-in);padding:8px 14px;text-align:center;min-width:90px}
.cnt b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.cnt.blocker b{color:var(--bad)} .cnt.warning b{color:var(--warn)} .cnt.info b{color:var(--title-a)}

/* dialogs */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px}
#shade.show{display:flex}
.dlg{background:var(--chrome);box-shadow:var(--bevel-out),3px 3px 0 rgba(0,0,0,.35);
  padding:3px;min-width:300px;max-width:min(480px,92vw)}
.dlg .dtitle{padding:2px 4px 2px 6px;color:#fff;font-weight:bold;
  background:linear-gradient(90deg,var(--title-a),var(--title-b));
  display:flex;justify-content:space-between;align-items:center}
.dlg .dbody{padding:14px;display:flex;gap:12px}
.dlg .dico{font-size:28px;line-height:1}
.dlg .dmsg{font-size:11px;line-height:1.5;min-width:0}
.dlg .dmsg code{background:var(--paper);box-shadow:var(--bevel-thin-in);padding:1px 4px;display:inline-block;margin:1px 0;font:10px "Lucida Console",monospace}
.dlg .dbtns{display:flex;justify-content:center;gap:8px;padding:0 14px 12px}
.dlg input[type=text]{font:inherit;border:none;box-shadow:var(--bevel-in);
  padding:4px;width:100%;background:var(--paper);color:var(--ink)}
.dlg .frm{display:flex;flex-direction:column;gap:6px;flex:1}
.dlg label{color:var(--ink-soft)}

@media (max-width:700px){
  body{padding:4px}
  #sidebar{position:absolute;z-index:40;top:0;bottom:0;left:0;display:none;
    box-shadow:var(--bevel-in),4px 0 12px rgba(0,0,0,.3)}
  #main{position:relative}
  #sidebar.open{display:flex}
  .cprow .nm{min-width:0}
}

<script>
"use strict";
/* ======================================================================= */
/* backends: Live talks to the local server; Demo reads data packed into   */
/* this file by tools/build_demo.py.                                       */

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const Live = {
  name: "live",
  canAct: true,
  programs: () => api("/api/programs"),
  files: (p) => api(`/api/files?program=${encodeURIComponent(p)}`),
  async fileText(p, path) {
    const r = await fetch(this.fileURL(p, path));
    if (!r.ok) throw new Error("could not read " + path);
    return r.text();
  },
  fileURL: (p, path, dl) =>
    `/api/file?program=${encodeURIComponent(p)}&path=${encodeURIComponent(path)}` +
    (dl ? "&download=1" : ""),
  check: (p) => api("/api/check", {method: "POST",
    body: JSON.stringify({program: p})}),
  generate: (p) => api("/api/generate", {method: "POST",
    body: JSON.stringify({program: p})}),
  confirm: (p, checkpoint, by, notes) => api("/api/confirm", {method: "POST",
    body: JSON.stringify({program: p, checkpoint, by, notes})}),
};

const Demo = {
  name: "demo",
  canAct: false,
  _prog(p) { return window.DEMO_DATA.programs.find(x => x.id === p); },
  programs: async () => window.DEMO_DATA.programs,
  files: async function (p) { return this._prog(p).files.map(f => ({
    path: f.path, name: f.name, group: f.group, ext: f.ext, size_kb: f.size_kb})); },
  fileText: async function (p, path) {
    const f = this._prog(p).files.find(x => x.path === path);
    if (!f || f.content == null) throw new Error("not packed into the demo");
    return f.content;
  },
  fileB64: function (p, path) {
    const f = this._prog(p).files.find(x => x.path === path);
    return f && f.b64 ? f.b64 : null;
  },
  check: async function (p) { return this._prog(p).check; },
};

/* ======================================================================= */
const S = {backend: null, programs: [], progId: null, files: [],
           view: null, lastCheck: {}, currentPath: null, downloads: null};
const $ = (id) => document.getElementById(id);

/* On claude.ai the viewer grants saves through the downloads capability;
   resolve it in the background and add the Save button once it arrives. */
(async () => {
  try {
    if (window.claude?.use) {
      S.downloads = await window.claude.use("downloads");
      if (S.downloads && S.currentPath) openFile(S.currentPath);
    }
  } catch (e) { /* design for absence */ }
})();

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ---- tiny markdown renderer (headings, tables, lists, bold, code) ----- */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function mdRender(md) {
  const lines = md.split(/\r?\n/);
  let out = [], i = 0, list = false;
  const closeList = () => { if (list) { out.push("</ul>"); list = false; } };
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|/.test(ln)) {               // table block
      closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push('<div class="tablewrap"><table class="grid">');
      rows.forEach((r, ri) => {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(r)) return;     // separator row
        const cells = r.trim().replace(/^\||\|$/g, "").split("|");
        const tag = ri === 0 ? "th" : "td";
        out.push("<tr>" + cells.map(c =>
          `<${tag}>${mdInline(c.trim())}</${tag}>`).join("") + "</tr>");
      });
      out.push("</table></div>");
      continue;
    }
    if (/^#{1,3} /.test(ln)) { closeList();
      const level = ln.match(/^#+/)[0].length;
      out.push(`<h${level}>${mdInline(ln.replace(/^#+ /, ""))}</h${level}>`);
    } else if (/^\s*[-*] /.test(ln)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + mdInline(ln.replace(/^\s*[-*] /, "")) + "</li>");
    } else if (/^> /.test(ln)) { closeList();
      out.push("<blockquote>" + mdInline(ln.slice(2)) + "</blockquote>");
    } else if (/^---+\s*$/.test(ln)) { closeList(); out.push("<hr>");
    } else if (ln.trim() === "") { closeList();
    } else { closeList(); out.push("<p>" + mdInline(ln) + "</p>"); }
    i++;
  }
  closeList();
  return '<div class="doc">' + out.join("\n") + "</div>";
}

/* ---- CSV ---------------------------------------------------------------*/
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; }
        else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || "").trim() !== "");
}
function csvRender(text) {
  const rows = parseCSV(text);
  if (!rows.length) return '<div class="doc"><p>(empty)</p></div>';
  let h = '<div class="doc" style="max-width:none"><div class="tablewrap"><table class="grid">';
  rows.forEach((r, ri) => {
    const tag = ri === 0 ? "th" : "td";
    h += "<tr>" + r.map(c => `<${tag}>${esc(c)}</${tag}>`).join("") + "</tr>";
  });
  return h + "</table></div></div>";
}

function renderTree() {
  const t = $("tree");
  let h = `<div class="titem" data-view="home">${ICONS.home}<span>Program overview</span></div>`;
  if (S.lastCheck[S.progId]) {
    h += `<div class="titem" data-view="findings">${ICONS.find}<span>Check results</span></div>`;
  }
  const groups = {};
  S.files.forEach(f => (groups[f.group] = groups[f.group] || []).push(f));
  GROUP_ORDER.forEach(g => {
    if (!groups[g]) return;
    const open = !collapsed[g];
    h += `<div class="tgroup" data-group="${esc(g)}"><span class="box">${open ? "−" : "+"}</span>${esc(g)} <span class="tcount">(${groups[g].length})</span></div>`;
    if (open) groups[g].forEach(f => {
      h += `<div class="titem" data-path="${esc(f.path)}" title="${esc(f.name)} — ${f.size_kb} KB">${icon(f.ext)}<span>${esc(f.name)}</span></div>`;
    });
  });
  if (!S.files.length) {
    h += `<div style="padding:10px;color:#9a968c">No deliverables yet.<br>Use <b>Generate deliverables</b>.</div>`;
  }
  t.innerHTML = h;

    t.querySelectorAll(".titem.sel").forEach(x => x.classList.remove("sel"));

    collapsed[el.dataset.group] = !collapsed[el.dataset.group];
    renderTree();
  });
}

const canDownload = () =>
  S.backend === Live || location.protocol === "file:" || !!S.downloads;

async function openFile(path) {
  const f = S.files.find(x => x.path === path); if (!f) return;
  S.currentPath = path;
  setAddr(f.name);
  $("st-file").textContent = `${f.name} — ${f.size_kb} KB`;
  const v = $("viewer");
  let tool = `<div class="vtool"><span class="fname">${icon(f.ext)} ${esc(f.name)}</span>
    <span class="meta">${f.size_kb} KB</span>`;
  if (canDownload()) tool += `<button class="xbtn" id="v-dl">Save a copy…</button>`;
  const isSvg = f.ext === "svg";
  if (isSvg) tool += `<span class="tsep"></span>
    <button class="xbtn" data-z="out">−</button>
    <button class="xbtn" data-z="fit">Fit width</button>
    <button class="xbtn" data-z="in">+</button>
    <button class="xbtn" data-z="100">1:1 (true scale ≈ screen dependent)</button>`;
  tool += "</div>";

  if (["xlsx", "pdf", "png"].includes(f.ext)) {
    v.innerHTML = tool + `<div class="binmsg">${icon(f.ext)}<br><br>
      <b>${esc(f.name)}</b> is a binary file (${f.ext.toUpperCase()}).<br>
      ${canDownload() ? "Use <b>Save a copy…</b> to open it in its own program."
        : "Open the live app on your computer to save it (Help → How to run the live app)."}</div>`;
    hookDownload(f);
    return;
  }
  let text;
  try { text = await S.backend.fileText(S.progId, path); }
  catch (e) {
    v.innerHTML = tool + `<div class="binmsg">This file is not packed into the
      demo. Run the live app to open it.</div>`;
    return;
  }
  if (f.ext === "md") v.innerHTML = tool + mdRender(text);
  else if (f.ext === "csv") v.innerHTML = tool + csvRender(text);
  else if (isSvg) {
    v.innerHTML = tool + `<div class="svgwrap" id="svgwrap">${text.replace(/^[\s\S]*?<svg/, "<svg")}</div>`;
    initSvgZoom();
  } else v.innerHTML = tool + `<pre class="plain">${esc(text)}</pre>`;
  hookDownload(f, text);
}

function demoBytes(f, text) {
  if (text != null) return text;
  const b64 = Demo.fileB64 && Demo.fileB64(S.progId, f.path);
  if (!b64) return null;
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function hookDownload(f, text) {
  const b = $("v-dl"); if (!b) return;
  b.onclick = async () => {
    const fname = f.name.split("/").pop();
    if (S.backend === Live) {
      location.href = Live.fileURL(S.progId, f.path, true);
      return;
    }
    const data = demoBytes(f, text);
    if (data == null) {
      dialog("Save a copy", "This file is not packed into the demo.", null, "⚠️");
      return;
    }
    if (S.downloads) {               // claude.ai viewer: capability save
      try { await S.downloads.save({filename: fname, data}); }
      catch (e) {
        if (e && e.code !== "declined")
          dialog("Save a copy", "Could not save: " + esc(e.message || e.code),
                 null, "⚠️");
      }
      return;
    }
    const blob = data instanceof Uint8Array ? new Blob([data])
      : new Blob([data], {type: "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
}

function initSvgZoom() {
  const wrap = $("svgwrap"); if (!wrap) return;
  const svg = wrap.querySelector("svg"); if (!svg) return;
  const vb = (svg.getAttribute("viewBox") || "0 0 2400 1200").split(/\s+/);
  const natW = parseFloat(vb[2]) || 2400;
  let scale;
  const apply = () => { svg.style.width = (natW * scale) + "px"; svg.style.height = "auto"; };
  const fit = () => { scale = (wrap.clientWidth - 30) / natW; apply(); };
  fit();
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    if (b.dataset.z === "in") scale *= 1.3;
    else if (b.dataset.z === "out") scale /= 1.3;
    else if (b.dataset.z === "100") scale = 3.7795; /* ~96dpi px per mm */
    else { fit(); return; }
    apply();
  });
}

async function runChecks() {
  try {
    const res = await S.backend.check(S.progId);
    S.lastCheck[S.progId] = res;
    const n = (s) => res.findings.filter(f => f.severity === s).length;
    $("st-findings").textContent =
      `${n("blocker")} blockers · ${n("warning")} warnings · ${n("info")} info`;
    renderTree();
    showFindings();
  } catch (e) { dialog("Run checks", esc(e.message), null, "⚠️"); }
}

async function runGenerate() {
  if (!S.backend.canAct) return demoNote("Generate deliverables");
  $("b-generate").disabled = true;
  $("st-file").textContent = "generating… (formboards, costing, procurement)";

    const res = await S.backend.generate(S.progId);
    S.files = await S.backend.files(S.progId);
    renderTree();
    let msg = "<b>Produced:</b><br>" + res.produced.map(esc).join("<br>");
    if (res.withheld.length) {

    if (act === "focus-program") $("selprog").focus();
    else if (act === "download") { const b = $("v-dl"); if (b) b.click();
      else dialog("Save current file", "Open a file first.", null, "ℹ️"); }
    else if (act === "close") $("b-close").onclick();
    else if (act === "check") runChecks();
    else if (act === "generate") runGenerate();
    else if (act === "confirm") confirmDialog();
    else if (act === "toggle-folders") $("b-folders").onclick();
    else if (act === "home") showHome();
    else if (act === "howto") dialog("How to run the live app", HOWTO_HTML, null, "🛠️");
    else if (act === "about") dialog("About Harness Planner 98",
      `<b>Harness Planner 98</b><br>version 0.1 — the clickable face of the
      harness-planner engine.<br><br>It reads one structured program file,
      runs the rules engine (BOM reconciliation, compatibility, accessory
      cascade, tooling reuse) and generates every deliverable: BOMs,
      termination maps, tooling lists, line plans, costing workbooks,
      procurement lists and true-scale formboards.<br><br>
      All example data is synthetic.`, null, "🔌");
  });
});

init();
</script>
