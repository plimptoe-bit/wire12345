[project]
name = "harness-planner"
version = "0.1.0"
description = "Wire-harness program planning: BOM reconciliation, rules engine, tooling reuse, costing, formboards, procurement"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "openpyxl>=3.1",
    "reportlab>=4",
]

[project.optional-dependencies]
pdf = ["cairosvg>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
harness-planner = "harness_planner.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness_planner*"]

[tool.setuptools.package-data]
harness_planner = ["schema/*.json"]
