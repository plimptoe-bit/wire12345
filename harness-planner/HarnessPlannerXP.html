<title>Harness Planner XP</title>
<style>
/* Layout: one Luna-style application window on an XP desktop; folders tree
   left, viewer right. Single-theme by choice: Windows XP Luna is the visual
   world, every color explicit. */
:root{
  --desktop:#3A6EA5;
  --chrome:#ECE9D8;
  --chrome-dk:#D4D0C8;
  --frame:#0855DD;
  --frame-deep:#0831D9;
  --title-a:#0A57E3; --title-b:#4A90F4; --title-c:#1565E8;
  --menu-hi:#316AC5;
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --ink-soft:#4A4A42;
  --sel:#316AC5;
  --ok:#2C7A2C; --warn:#B86800; --bad:#C22A20;
}
html,body{height:100%}
body{
  margin:0;background:var(--desktop);
  background:linear-gradient(160deg,#4E87C9 0%,#3A6EA5 45%,#2C567F 100%);
  color:var(--ink);
  font:11px Tahoma,"Segoe UI",Verdana,sans-serif;
  padding:14px 16px;box-sizing:border-box;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  overflow:hidden;
}
*{box-sizing:border-box}
#win{
  display:flex;flex-direction:column;height:100%;
  border:1px solid var(--frame-deep);
  border-radius:8px 8px 3px 3px;
  box-shadow:0 8px 30px rgba(0,20,60,.45);
  background:var(--chrome);
  overflow:hidden;min-width:0;
}
#win.maxi{border-radius:0}
body:has(#win.maxi){padding:0;
  padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}

/* ---- title bar ------------------------------------------------------- */
#titlebar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:4px 5px 4px 8px;user-select:none;
  background:linear-gradient(180deg,#2B74E8 0%,var(--title-b) 8%,#2165DF 18%,var(--title-a) 38%,#0A54D8 72%,#0D5CE4 86%,#0845B4 100%);
  color:#fff;text-shadow:1px 1px 1px #0E3F9E;
  font-weight:bold;font-size:12px;
}
#titlebar .ico{width:16px;height:16px;flex:0 0 auto}
#titlebar .t{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption-btns{display:flex;gap:2px}
.cbtn{
  width:21px;height:21px;border-radius:3px;border:1px solid #fff;
  color:#fff;font:bold 11px Tahoma,sans-serif;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(180deg,#7DA7EE 0%,#3B77E0 45%,#2B63CC 100%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.cbtn:hover{filter:brightness(1.15)}
.cbtn.close{background:linear-gradient(180deg,#F2A38C 0%,#E2573A 40%,#C33B1F 100%)}

/* ---- menu + toolbar --------------------------------------------------- */
#menubar{flex:0 0 auto;display:flex;background:var(--chrome);
  border-bottom:1px solid #fff;padding:1px 2px;user-select:none}
.menu{position:relative}
.menu>button{border:1px solid transparent;background:none;font:inherit;
  padding:3px 8px;cursor:default;color:var(--ink)}
.menu.open>button,.menu>button:hover{background:var(--menu-hi);color:#fff}
.dropdown{position:absolute;left:0;top:100%;z-index:60;min-width:230px;
  background:var(--paper);border:1px solid #999;
  box-shadow:3px 3px 4px rgba(0,0,0,.3);padding:2px;display:none}
.menu.open .dropdown{display:block}
.mi{display:flex;gap:8px;align-items:center;padding:4px 18px 4px 26px;
  cursor:default;white-space:nowrap;color:var(--ink)}
.mi:hover{background:var(--menu-hi);color:#fff}
.mi.dis{color:#9a968c}
.mi.dis:hover{background:none;color:#9a968c}
.msep{height:1px;background:#d9d6c8;margin:3px 2px}

#toolbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:4px 6px;background:var(--chrome);
  border-top:1px solid #fff;border-bottom:1px solid #aca899}
.tsep{width:1px;align-self:stretch;background:#aca899;border-right:1px solid #fff;margin:2px 2px}
.xbtn{
  display:inline-flex;align-items:center;gap:5px;
  font:inherit;color:var(--ink);cursor:pointer;
  padding:3px 10px;border:1px solid #003C74;border-radius:3px;
  background:linear-gradient(180deg,#FFFFFF 0%,#ECEBE5 60%,#D8D0C4 100%);
  box-shadow:inset 0 0 0 1px #fff;
}
.xbtn:hover{box-shadow:inset 0 0 0 1px #FFF4CF,inset 0 -2px 4px #E5A245}
.xbtn:active{background:linear-gradient(180deg,#D8D0C4,#ECEBE5)}
.xbtn:disabled{color:#9a968c;border-color:#9a968c;box-shadow:none;cursor:default}
.xbtn .bico{width:14px;height:14px}
select.xsel{font:inherit;padding:2px;border:1px solid #7F9DB9;background:#fff;color:var(--ink);max-width:220px}
label.tl{color:var(--ink-soft)}

/* ---- main area -------------------------------------------------------- */
#main{flex:1 1 auto;display:flex;min-height:0;background:var(--chrome);padding:0 3px 3px}
#sidebar{
  flex:0 0 240px;display:flex;flex-direction:column;min-height:0;
  margin-right:3px;border:1px solid #808080;background:var(--paper);
}
#sidebar .paneltitle{
  flex:0 0 auto;padding:3px 8px;font-weight:bold;color:#fff;
  background:linear-gradient(90deg,#1C5BC3,#5F9BE8);
}
#tree{flex:1 1 auto;overflow:auto;padding:4px 2px}
.titem{display:flex;align-items:center;gap:5px;padding:2px 6px;white-space:nowrap;cursor:default;color:var(--ink)}
.titem:hover{text-decoration:underline;color:var(--sel)}
.titem.sel{background:var(--sel);color:#fff}
.titem .fico{flex:0 0 auto}
.tgroup{margin:6px 4px 1px;font-weight:bold;color:#1C5BC3;display:flex;gap:5px;align-items:center;cursor:default}
.tgroup .box{width:11px;height:11px;border:1px solid #7F9DB9;background:#fff;
  font:9px/9px Tahoma;display:inline-flex;align-items:center;justify-content:center;color:#1C5BC3}
.tcount{color:#9a968c;font-weight:normal}

#contentcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0}
#addressbar{flex:0 0 auto;display:flex;gap:6px;align-items:center;
  padding:3px 6px;background:var(--chrome);border-bottom:1px solid #aca899}
#addressbar .ad{flex:1 1 auto;display:flex;gap:6px;align-items:center;
  background:#fff;border:1px solid #7F9DB9;padding:2px 6px;min-width:0;color:var(--ink)}
#addressbar .ad span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer{flex:1 1 auto;overflow:auto;background:var(--paper);
  border:1px solid #808080;border-top:none;padding:0;min-width:0}

/* ---- status bar ------------------------------------------------------- */
#statusbar{flex:0 0 auto;display:flex;gap:3px;padding:2px 3px 3px;background:var(--chrome)}
.spanel{border:1px solid;border-color:#aca899 #fff #fff #aca899;
  padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.spanel.grow{flex:1 1 auto}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

/* ---- viewer content --------------------------------------------------- */
.vtool{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:5px 8px;background:#F4F3EE;border-bottom:1px solid #d9d6c8;
  position:sticky;top:0;z-index:5}
.vtool .fname{font-weight:bold}
.vtool .meta{color:var(--ink-soft)}
.doc{padding:14px 18px;max-width:900px;font-size:12px;line-height:1.5}
.doc h1{font-size:17px;margin:4px 0 10px;color:#0A3E8C;text-wrap:balance}
.doc h2{font-size:14px;margin:16px 0 6px;color:#0A3E8C;border-bottom:1px solid #d9d6c8;padding-bottom:2px}
.doc h3{font-size:12px;margin:12px 0 4px}
.doc p{margin:6px 0}
.doc ul{margin:4px 0;padding-left:22px}
.doc li{margin:2px 0}
.doc blockquote{margin:8px 0;padding:6px 10px;background:#FFFBE8;border-left:3px solid #E5A245}
.doc code{font:11px "Lucida Console",Consolas,monospace;background:#F4F3EE;padding:0 3px}
.doc hr{border:none;border-top:1px solid #d9d6c8}
.tablewrap{overflow-x:auto;margin:8px 0;border:1px solid #aca899}
table.grid{border-collapse:collapse;font-size:11px;min-width:100%}
table.grid th{background:linear-gradient(180deg,#FDFDFB,#E5E2D5);text-align:left;
  padding:4px 8px;border-right:1px solid #d9d6c8;border-bottom:1px solid #aca899;
  white-space:nowrap;position:sticky;top:0}
table.grid td{padding:3px 8px;border-right:1px solid #EDEBE0;border-bottom:1px solid #EDEBE0;
  vertical-align:top;font-variant-numeric:tabular-nums}
table.grid tr:nth-child(even) td{background:#F7F6F1}
pre.plain{font:11px "Lucida Console",Consolas,monospace;padding:14px 18px;margin:0;white-space:pre-wrap}
.svgwrap{overflow:auto;padding:12px;background:
  repeating-conic-gradient(#f2f1ec 0% 25%, #ffffff 0% 50%) 0 0/24px 24px}
.svgwrap svg{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);max-width:none;display:block}
.sev{display:inline-block;padding:1px 7px;border-radius:8px;color:#fff;font-weight:bold;font-size:10px}
.sev.blocker{background:var(--bad)} .sev.warning{background:var(--warn)} .sev.info{background:#3C6EB4}
.binmsg{padding:30px;text-align:center;color:var(--ink-soft)}

/* home view */
.home{padding:14px 18px;display:flex;flex-direction:column;gap:12px;max-width:980px}
.hcard{border:1px solid #aca899;background:#FDFDFB}
.hcard .hhdr{padding:4px 10px;font-weight:bold;color:#fff;
  background:linear-gradient(90deg,#1C5BC3,#5F9BE8)}
.hcard .hbody{padding:10px 12px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px}
.kv dt{color:var(--ink-soft)} .kv dd{margin:0}
.cps{display:flex;flex-direction:column;gap:6px}
.cprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cprow .nm{font-weight:bold;min-width:220px}
.badge{padding:1px 8px;border-radius:8px;font-weight:bold;font-size:10px;color:#fff}
.badge.ok{background:var(--ok)} .badge.pend{background:var(--warn)}
.counts{display:flex;gap:10px;flex-wrap:wrap}
.cnt{border:1px solid #aca899;background:#fff;padding:8px 14px;text-align:center;min-width:90px}
.cnt b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.cnt.blocker b{color:var(--bad)} .cnt.warning b{color:var(--warn)} .cnt.info b{color:#3C6EB4}

/* dialogs */
#shade{position:fixed;inset:0;background:rgba(40,60,90,.25);display:none;
  align-items:center;justify-content:center;z-index:100;padding:16px}
#shade.show{display:flex}
.dlg{background:var(--chrome);border:1px solid var(--frame-deep);
  border-radius:8px 8px 3px 3px;box-shadow:0 8px 30px rgba(0,20,60,.5);
  min-width:300px;max-width:min(480px,92vw)}
.dlg .dtitle{padding:4px 8px;color:#fff;font-weight:bold;
  background:linear-gradient(180deg,#2B74E8,#0A54D8);border-radius:7px 7px 0 0;
  display:flex;justify-content:space-between;align-items:center}
.dlg .dbody{padding:14px;display:flex;gap:12px}
.dlg .dico{font-size:28px;line-height:1}
.dlg .dmsg{font-size:11px;line-height:1.5;min-width:0}
.dlg .dmsg code{background:#fff;border:1px solid #d9d6c8;padding:1px 4px;display:inline-block;margin:1px 0;font:10px "Lucida Console",monospace}
.dlg .dbtns{display:flex;justify-content:center;gap:8px;padding:0 14px 12px}
.dlg input[type=text]{font:inherit;border:1px solid #7F9DB9;padding:3px;width:100%;background:#fff;color:var(--ink)}
.dlg .frm{display:flex;flex-direction:column;gap:6px;flex:1}
.dlg label{color:var(--ink-soft)}

@media (max-width:700px){
  body{padding:6px}
  #sidebar{position:absolute;z-index:40;top:0;bottom:0;left:0;display:none;
    box-shadow:4px 0 12px rgba(0,0,0,.3)}
  #main{position:relative}
  #sidebar.open{display:flex}
  .cprow .nm{min-width:0}
}
</style>

<div id="win">

</div>

%) until quotes are in hand. Labor loading multiplier 1.6x; depreciation over 3 years; NRE amortized over the 52-week horizon.\n\n## Cost per set at each volume (sets/week; labor mode: manual)\n| Volume | Material | Labor (direct) | Labor (loaded) | Depreciation | NRE | Overhead | **Total/set** |\n|---|---|---|---|---|---|---|---|\n| 10 | $55.15 | $83.09 | $132.95 | $4.51 | $5.23 | $4.00 | **$201.85** |\n| 30 | $55.13 | $83.09 | $132.95 | $1.50 | $1.74 | $4.00 | **$195.33** |\n| 50 | $55.13 | $83.09 | $132.95 | $0.90 | $1.05 | $4.00 | **$194.03** |\n| 75 | $55.13 | $83.09 | $132.95 | $0.60 | $0.70 | $4.00 | **$193.38** |\n| 100 | $55.13 | $83.09 | $132.95 | $0.45 | $0.52 | $4.00 | **$193.05** |\n\nPer-harness split of a set: {'D-1001': 1, 'D-1002': 2, 'D-1003': 1, 'D-1004': 1, 'D-1005': 1, 'D-1006': 1, 'D-1007': 2} — per-harness cost is the set cost split by harness labor minutes (appendix of the spreadsheet).\n\nNRE one-time total: **$2,722.00**; equipment capital (buy now): $6,500.00.\n- TERM-MAT-CONT: existing tool FIX-HT-0640 (qualify): $243.20\n- RCPT-GC-075: existing tool FIX-HT-F2 (qualify): $243.20\n- TERM-PIN-N22: buy named tool TOOL-M12-HAND: $290.00\n- setup Harness continuity/hipot tester: $486.40\n- formboards + first-article build (assumption A-NRE: 16 h): $972.80\n- training (assumption A-TRAIN: 8 h): $486.40\n\n## Man-hours\n- One-time: 44.8 h\n- Recurring: 2.19 h per set\n\n## Make vs buy (quote: AsiaHarness Co (fixture))\nQuoted $310.00/set — its line items extend to only $32.69, so the quoted price carries labor/overhead not itemized; reconcile before relying on it (lesson 10).\nQuote does not cover 17 part(s) (FIXEL-01, HSG-DTM-2P, HSG-DTM-2S, HSG-GC-2, INSERT-M12, LBL-01, PLUG-DTM-16, RCPT-GC-075, SHLD-BRL-01, TAPE-SW-01, TERM-DTM-16, TERM-PIN-N22, TPA-NANO-4, W-FLRY-050, W-FLRY-096, W-TWIN-22, WEDGE-DTM-2) — gap estimated at $24.03/set and **marked as our estimate** (lesson 10). Quote covers Ethernet and sensor harnesses only; DTM/M12 parts excluded ('quoted separately on request').\n\n| Volume | Make/set | Buy/set (incl. gap) | Weekly diff (buy−make) | Annual diff | Cheaper |\n|---|---|---|---|---|---|\n| 10 | $201.85 | $334.03 | $1,321.81 | $63,446.83 | make |\n| 30 | $195.33 | $334.03 | $4,161.03 | $199,729.30 | make |\n| 50 | $194.03 | $334.03 | $7,000.04 | $336,002.16 | make |\n| 75 | $193.38 | $334.03 | $10,548.82 | $506,343.24 | make |\n| 100 | $193.05 | $334.03 | $14,098.09 | $676,708.32 | make |\n\n**Recommendation: make in-house.** In-house: ECO turnaround in days not weeks, quality ownership, no NCNR exposure on customer changes, capacity under our control; headcount and training are ours to carry. Outside: frees floor space and technicians, but FAI lead time on every revision and margin goes to the supplier.\n\n## Margin at selling price $410.00/set\n| Volume | Cost/set | GM/set | GM % | GM/year |\n|---|---|---|---|---|\n| 10 | $201.85 | $208.15 | 50.8% | $99,912.00 |\n| 30 | $195.33 | $214.67 | 52.4% | $309,124.80 |\n| 50 | $194.03 | $215.97 | 52.7% | $518,328.00 |\n| 75 | $193.38 | $216.62 | 52.8% | $779,832.00 |\n| 100 | $193.05 | $216.95 | 52.9% | $1,041,360.00 |\n\nBreak-even: **0.45 sets/week** against weekly fixed cost $97.49.\n\nSensitivity (at lowest planned volume):\n| Case | Cost/set | GM % |\n|---|---|---|\n| base | $201.84 | 50.8% |\n| material +15% | $210.11 | 48.8% |\n| material −15% | $193.57 | 52.8% |\n| time standards +25% | $235.08 | 42.7% |\n| time standards −25% | $168.60 | 58.9% |\n| labor rate +10% | $215.13 | 47.5% |\n"}, {"path": "costing.xlsx", "name": "costing.xlsx", "group": "Reports", "ext": "xlsx", "size_kb": 12.3, "b64": "UEsDBBQAAAAIAAc5Sl1Gx01IlQAAAM0AAAAQAAAAZG9jUHJvcHMvYXBwLnhtbE3PTQvCMAwG4L9SdreZih6kDkQ9ip68zy51hbYpbYT67+0EP255ecgboi6JIia2mEXxLuRtMzLHDUDWI/o+y8qhiqHke64x3YGMsRoPpB8eA8OibdeAhTEMOMzit7Dp1C5GZ3XPlkJ3sjpRJsPiWDQ6sScfq9wcChDneiU+ixNLOZcrBf+LU8sVU57mym/8ZAW/B7oXUEsDBBQAAAAIAAc5Sl2NIBWD7gAAACsCAAARAAAAZG9jUHJvcHMvY29yZS54bWzNksFKxDAQhl9Fcm8n6eIqoZu 160) (wedgelock up)\n 2. Route segment S1 (DIAG, cut 306 mm) along its path; terminate per termination map\n 3. Inspect per overlay inspection box; record on traveller; final length check against overlay\n"}, {"path": "management_summary.md", "name": "management_summary.md", "group": "Reports", "ext": "md", "size_kb": 3.2, "content": "# ETHDTM-2025 — management summary\n\nCustomer: ACME Mobility (SYNTHETIC FIXTURE — all part numbers, documents and prices are invented regression-test data, tagged rank 1-5 only to exercise the citation plumbing) · drawing rev B · 2025-11-03\n\n**Volumes** are stated in the customer's unit (**sets/week**): planned [10, 30, 50], plus [1.5, 2.0] upper limits.\n\n- Labor: **2.19 h per set** (manual; planning estimate ±25%).\n- At the 100 sets/week upper limit: **219 h/week, 7 technician(s)**; second shift needed.\n- Cost per set: **$193.05** at 100/wk to **$201.85** at 10/wk (budgetary ±30%).\n- One-time (NRE + tooling): **$2,722.00**; equipment capital: $6,500.00.\n- Margin at $410.00/set: **50.8%** at 10/wk; break-even 0.45 sets/week.\n- Make vs buy: **make in-house** (quote AsiaHarness Co (fixture); gaps estimated and marked).\n- Findings: **7 blockers** (customer answers needed), 16 warnings. See open-items register.\n\n## Decisions needed\n- **R001** BOM line L01 calls PTA-ETH-2M a connector (\"Connector, automotive Ethernet, 4-pos header\") but the manufacturer document shows it is a factory-terminated cable assembly — proposed default: Treat as a bought assembly (cut in half where the drawing uses one end); drop the loose contacts and bulk wire listed for it.\n- **R002** BOM line L02 lists loose contacts TERM-NANO-ETH (family MATEnet-NanoMQS-SYN) but every MATEnet-NanoMQS-SYN termination on the program comes factory-terminated on PTA-ETH-2M — contacts are not needed — proposed default: Remove the contacts (and their wire) from the buy.\n- **R012** TERM-NANO-ETH: customer BOM lists 4 per set but the harness structure consumes none — spares, error, or a second termination the drawing doesn't show — proposed default: Plan to the structure-derived count; confirm the difference with the customer before ordering.\n- **R013** TERM-PIN-N22: customer BOM lists 2 per set, harness structure needs 6 — proposed default: Plan to the structure-derived count; confirm the difference with the customer before ordering.\n- **F001** Wire W-M22 insulation OD 1.73–1.78 mm is outside terminal TERM-NANO-050 insulation range 1.2–1.6 mm — proposed default: Select the insulation-range variant of the same terminal (see variant suggestion finding).\n- **F003** Conductor 0.96 mm² of W-FLRY-096 is outside terminal RCPT-GC-075 wire range 0.5–0.75 mm² — proposed default: Ask customer to substitute a terminal validated for 0.96 mm², or change the wire; do not build as drawn.\n- **F004** Terminal TERM-PIN-N22 (Ni plating) is not validated for 0.34 mm² wire per its product spec; validated combinations: [{'plating': 'Au', 'wire_mm2_range': [0.2, 0.35]}, {'plating': 'Ni', 'wire_mm2_range': [0.5, 0.6]}] — proposed default: Use the plating variant the spec validates for this wire size (customer drawing change).\n\n## Assumptions register (top)\n- A-VOL: Volumes are in SETS per week (owner confirmed; lesson 8) [confirmed]\n- A-RATES: Technician $38/h, loaded 1.6x, 32 productive h/week, 48 weeks/year [confirmed]\n- A-SCRAP: 3% material scrap allowance at prototype volume [open]\n\nAppendices: BOM (bom.csv), termination map, tooling list, production plan, cost workbook (costing.xlsx), procurement CSVs, formboards (per harness).\n"}, {"path": "procurement.md", "name": "procurement.md", "group": "Procurement", "ext": "md", "size_kb": 4.3, "content": "# Procurement — ETHDTM-2025\n\nOrder horizon: 8 weeks of material at the maximum planned volume (100 sets/week), MOQ/package rounding and 3% scrap applied. Prices are budgetary (±30%) until quoted.\n\n## Purchased material\n| MPN | Manufacturer | Description | Qty | UoM | Unit price | Ext | auto (min) |\n|---|---|---|---|---|---|---|---|---|---|\n| D-1001 | ethernet | 0/0 | 0/0 | 0/0 | 1/1 | 4/4 | 2/2 | 7.0 | 7.0 |\n| D-1002 | ethernet | 0/0 | 2.5/2.5 | 3/0.5 | 2/2 | 2/2 | 5.2/5.2 | 14.7 | 12.2 |\n| D-1003 | sensor | 2.4/0.75 | 0/0 | 9/1.5 | 4/4 | 3.2/3.2 | 2.6/2.6 | 21.2 | 12.1 |\n| D-1004 | power | 1.6/0.5 | 0/0 | 6/1 | 3/3 | 2.4/2.4 | 2.4/2.4 | 15.4 | 9.3 |\n| D-1005 | io | 2.4/0.75 | 0/0 | 4.5/0.75 | 3/3 | 10.7/10.7 | 2.3/2.3 | 22.9 | 17.5 |\n| D-1006 | sensor | 2.4/0.75 | 0/0 | 9/1.5 | 4.5/4.5 | 4.8/4.8 | 2.6/2.6 | 23.3 | 14.2 |\n| D-1007 | power | 0.8/0.25 | 0/0 | 1.5/0.25 | 1/1 | 0.6/0.6 | 2.1/2.1 | 6.0 | 4.2 |\n\nMinutes per **set**: 131.2 manual / 92.8 semi-auto (cells show manual/semi-auto).\nShare of labor by station (manual): Crimp / solder 28.6%, Layout / tape / label 23.1%, Test / inspect / pack 20.2%, Connector assembly 16.4%, Cutting / stripping 7.9%, Cable preparation (shield / coax prep) 3.8%\n\n## Capacity and labor\nProductive hours: 32 h/wk per technician (program input); second shift above 4 technicians (assumption A-SHIFT).\n\n| Volume (sets/week) | Hours/week (manual) | Technicians | Bottleneck | Second shift? |\n|---|---|---|---|---|\n| 10 | 21.9 | 1 | Crimp / solder (6.2 h/wk) | no |\n| 30 | 65.6 | 3 | Crimp / solder (18.8 h/wk) | no |\n| 50 | 109.3 | 4 | Crimp / solder (31.2 h/wk) | no |\n| 75 | 164.0 | 6 | Crimp / solder (46.9 h/wk) | YES |\n| 100 | 218.7 | 7 | Crimp / solder (62.5 h/wk) | YES |\n\n## Equipment list\n| Equipment | Cost low–high | Rate | Setup (h) | Changeover (min) | Service | Calib. cost/yr | Life (yr) | Phase | Reason |\n|---|---|---|---|---|---|---|---|---|---|\n| Harness continuity/hipot tester | $4,000.00–$9,000.00 | 30/h | 8 | 10 | annual | $250.00 | 8 | buy_now | 500 V insulation test is a drawing requirement (D-1004) |\n| Benchtop cut & strip machine | $8,000.00–$15,000.00 | 500/h | 16 | 5 | annual | $150.00 | 8 | at_volume | payback only above ~50 sets/week |\n| Applicators for bench press (reel feed) | $7,000.00–$12,000.00 | 1200/h | 24 | 15 | 100k cycles | $200.00 | 10 | optional | hand tools qualified for prototype volume; revisit at 75+ sets/week |\n\n## Equipment trade-offs (payback in weeks)\n| Option | Cost (mid) | Min saved/set | @10 | @30 | @50 | @75 | @100 | Pays back in horizon at |\n|---|---|---|---|---|---|---|---|---|\n| Benchtop cut & strip machine | $11,500.00 | 7.28 | 155.9 | 52.0 | 31.2 | 20.8 | 15.6 | 30 sets/week |\n| Applicators for bench press (reel feed) | $9,500.00 | 22.5 | 41.7 | 13.9 | 8.3 | 5.6 | 4.2 | 10 sets/week |\n\n## Lead time to first shipment\n- Longest-lead material: PTA-ETH-2M (10 wk)\n- Tooling delivery: 6 wk\n- First article + qualification: 2 wk (assumption A-FAI)\n- Training: 1 wk (assumption A-TRAIN)\n- **Critical path: 13 weeks** — FAI/qualification and training run after the longer of material and tooling arrival; values are assumptions until scheduled.\n\n## Maintenance plan\n| Tool | Class | Calib. interval (mo) | PM | Consumables | Spares | Certified by | Cycles/wk added | Cost/yr |\n|---|---|---|---|---|---|---|---|---|\n| FIX-4IND-16 | hand_crimp | 12.0 | clean + inspect dies weekly; lubricate per instruction sheet | n/a | die set / nest | external lab (crimp height gauge traceable) | 700.0 | $120.00 |\n| FIX-HT-0640 | hand_crimp | 12.0 | clean + inspect dies weekly; lubricate per instruction sheet | n/a | die set / nest | external lab (crimp height gauge traceable) | 1100.0 | $120.00 |\n| FIX-HT-F2 | hand_crimp | 12.0 | clean + inspect dies weekly; lubricate per instruction sheet | n/a | die set / nest | external lab (crimp height gauge traceable) | 100.0 | $120.00 |\n\nCalibration cost per event is assumption A-CAL ($120.00) until quoted.\n"}, {"path": "qualification_RCPT-GC-075.md", "name": "qualification_RCPT-GC-075.md", "group": "Tooling", "ext": "md", "size_kb": 1.5, "content": "# Tool qualification sheet — FIX-HT-F2 for RCPT-GC-075\n\n- Terminal / joint: RCPT-GC-075 (Receptacle contact 0.5-0.75 mm2)\n- Go ill=\"white\" stroke=\"black\" stroke-width=\"0.8\"/>\n<text x=\"1988.0\" y=\"1096.0\" font-size=\"10\">customer drawing: G-2002 rev A<\/text>\n<text x=\"1988.0\" y=\"1112.0\" font-size=\"10\">board overlay rev: A-A  date: 2025-12-01<\/text>\n<text x=\"1988.0\" y=\"1128.0\" font-size=\"10\">program: GOLF-RF-2025<\/text>\n<text x=\"1988.0\" y=\"1144.0\" font-size=\"10\">change summary: initial generation from data model<\/text>\n<text x=\"30\" y=\"28\" font-size=\"9\" fill=\"#555\">NOTE: DRAFT — overlay not released: build and measure one harness on the first board before release (VALIDATE_FIRST_BOARD)<\/text>\n<text x=\"30\" y=\"40\" font-size=\"9\" fill=\"#555\">NOTE: dimension convention: point-to-point between node reference planes (default — confirm)<\/text>\n<\/svg>"}, {"path": "formboards/G-2002_board_open_items.md", "name": "formboards/G-2002_board_open_items.md", "group": "Formboards", "ext": "md", "size_kb": 0.3, "content": "# Formboard open items — do not release the overlay until answered\n\n- customer drawing dimension origin not recorded — default point-to-point convention applied; confirm before first board\n\nValidate the first board by building one harness and measuring against the customer drawing before release (checkpoint VALIDATE_FIRST_BOARD).\n"}, {"path": "formboards/G-2002_cutlist.csv", "name": "formboards/G-2002_cutlist.csv", "group": "Formboards", "ext": "csv", "size_kb": 0.4, "content": "segment,circuit,material_mpn,drawing_length_mm,tol_mm,allowance_A_mm,allowance_B_mm,cut_length_mm,source,allowance_basis\nS3,C3,W-HOOK-22,500,5,5.0,0.0,505.0,reel,A: strip 5 (assumed) | B: no termination at this end\nS2,C2,W-HOOK-22,500,5,5.0,0.0,505.0,reel,A: strip 5 (assumed) | B: no termination at this end\nS1,C1,W-HOOK-22,500,5,5.0,0.0,505.0,reel,A: strip 5 (assumed) | B: no termination at this end\n"}, {"path": "formboards/G-2002_pegs.csv", "name": "formboards/G-2002_pegs.csv", "group": "Formboards", "ext": "csv", "size_kb": 0.2, "content": "peg,x_mm_f  the connector variant for this cable group.\n- **F002** Wire W-HOOK-22 insulation rated 80 °C is below the 105 °C minimum for soldering to DSUB-9S — proposed default: Use higher-temperature insulation or crimp variant.\n\n## Assumptions register (top)\n- A-VOL-G: Volumes are in SETS per week [confirmed]\n- A-SOLDER: Hand solder, SAC305, iron 370 C; class 2 workmanship [open]\n\nAppendices: BOM (bom.csv), termination map, tooling list, production plan, cost workbook (costing.xlsx), procurement CSVs, formboards (per harness).\n"}, {"path": "procurement.md", "name": "procurement.md", "group": "Procurement", "ext": "md", "size_kb": 2.4, "content": "# Procurement — GOLF-RF-2025\n\nOrder horizon: 8 weeks of material at the maximum planned volume (30 sets/week), MOQ/package rounding and 5% scrap applied. Prices are budgetary (±30%) until quoted.\n\n## Purchased material\n| MPN | Manufacturer | Description | Qty | UoM | Unit price | Ext | Lead (wk) | Distributor | URL |\n|---|---|---|---|---|---|---|---|---|---|\n| BNC-STR-58 | SynRF | BNC straight plug, crimp, for RG58 cable group | 10000 | ea | 1.9000 | 19,000.00 | 5 | Mouser | URL not verified |\n| C-RG174 | SynCable | Coax RG174-type, 50 ohm, braid shield, jacket 2.8 mm, 80 C | 400 | m | 0.5500 | 220.00 | 4 | DigiKey | URL not verified |\n| DSUB-9S | SynConn | D-Sub 9-way socket, solder cup, max 0.6 mm2, wire insulation rated 105 C min for hand solder | 260 | ea | 1.4000 | 364.00 | 3 | Farnell | URL not verified |\n| FER-174 | SynRF | Crimp ferrule for RG174 group, hex 4.22 | 300 | ea | 0.1800 | 54.00 | 5 | DigiKey | URL not verified |\n| HS-1248 | SynShrink | Heat-shrink 12.7 to 6.4, adhesive lined | 10.08 | m | 2.1000 | 21.17 | 2 | RS | URL not verified |\n| PIN-SMA-174 | SynRF | SMA center pin, crimp, RG174 group | 300 | ea | 0.4000 | 120.00 | 5 | DigiKey | URL not verified |\n| SMA-STR-174 | SynRF | SMA straight plug, crimp, for RG174 cable group | 260 | ea | 2.9000 | 754.00 | 5 | DigiKey | URL not verified |\n| W-HOOK-22 | SynWire | Hook-up wire 0.34 mm2 (22 AWG), PVC 80 C | 400 | m | 0.0700 | 28.00 | 2 | Mouser | URL not verified |\n\n**Bucket total: USD 20,561.17** (unpriced lines excluded — they are open items)\n\n## Tools and equipment (separate order)\n| MPN | Manufacturer | Description | Qty | UoM | Unit price | Ext | Lead (wk) | Distributor | URL |\n|---|---|---|---|---|---|---|---|---|---|\n| TOOL-SMA-HEX | SynTool | Named hex crimp tool, 4.22 hex, RG174 group | 1 | ea | 240.0000 | 240.00 | 4 | — | URL not verified |\n\n**Bucket total: USD 240.00** (unpriced lines excluded — they are open items)\n\n## How to order\n- `procurement_octopart.csv` → upload to Octopart's BOM tool to compare distributors and push to carts.\n- `procurement_digikey.csv` → DigiKey myLists upload (shareable list).\n- `procurement_mouser.csv` → Mouser BOM tool / Project Manager upload.\n\nUpload-page URLs are found by search in run mode and recorded here only when verified; none are fabricated. If DigiKey/Mouser/Nexar API keys are configured, the cart can be built programmatically instead.\n"}, {"path": "procurement_digikey.csv", "name": "procurement_digikey.csv", "group": "Procurement", "ext": "csv", "size_kb": 0.5, "content": "Manufacturer Part Number,Quantity,Customer Reference\nBNC-STR-58,10000,\"BNC straight plug, crimp, for RG58 cable group\"\nC-RG174,400,\"Coax RG174-type, 50 ohm, braid shield, jacket 2.\"\nDSUB-9S,260,\"D-Sub 9-way socket, solder cup, max 0.6 mm2, wir\"\nFER-174,300,\"Crimp ferrule for RG174 group, hex 4.22\"\nHS-1248,11,\"Heat-shrink 12.7 to 6.4, adhesive lined\"\nPIN-SMA-174,300,\"SMA center pin, crimp, RG174 group\"\nSMA-STR-174,260,\"SMA straight plug, crimp, for RG174 cable group\"\nW-HOOK-22,400,\"Hook-up wire 0.34 mm2 (22 AWG), PVC 80 C\"\n"}, {"path": "procurement_mouser.csv", "name": "procurement_mouser.csv", "group": "Procurement", "ext": "csv", "size_kb": 0.6, "content": "Mfr Part Number,Quantity 1,Description,Customer Part Number\nBNC-STR-58,10000,\"BNC stra .75 | 0/0 | 9/9 | 2/2 | 4.3/4.3 | 2.3/2.3 | 20.0 | 18.4 |\n\nMinutes per **set**: 33.7 manual / 29.0 semi-auto (cells show manual/semi-auto).\nShare of labor by station (manual): Crimp / solder 35.6%, Layout / tape / label 19.9%, Test / inspect / pack 13.4%, Connector assembly 12.8%, Cutting / stripping 9.5%, Cable preparation (shield / coax prep) 8.9%\n\n## Capacity and labor\nProductive hours: 32 h/wk per technician (program input); second shift above 4 technicians (assumption A-SHIFT).\n\n| Volume (sets/week) | Hours/week (manual) | Technicians | Bottleneck | Second shift? |\n|---|---|---|---|---|\n| 5 | 2.8 | 1 | Crimp / solder (1.0 h/wk) | no |\n| 15 | 8.4 | 1 | Crimp / solder (3.0 h/wk) | no |\n| 22.5 | 12.6 | 1 | Crimp / solder (4.5 h/wk) | no |\n| 30 | 16.9 | 1 | Crimp / solder (6.0 h/wk) | no |\n\n## Equipment list\n| Equipment | Cost low–high | Rate | Setup (h) | Changeover (min) | Service | Calib. cost/yr | Life (yr) | Phase | Reason |\n|---|---|---|---|---|---|---|---|---|---|\n| 1-port VNA for RF test | $1,200.00–$4,000.00 | 20/h | 4 | 5 | annual | $300.00 | 8 | buy_now | return-loss test is a drawing requirement (G-2001) |\n\n## Equipment trade-offs (payback in weeks)\nNo parameterized options on file.\n\n## Lead time to first shipment\n- Longest-lead material: SMA-STR-174 (5 wk)\n- Tooling delivery: 4 wk\n- First article + qualification: 2 wk (assumption A-FAI)\n- Training: 1 wk (assumption A-TRAIN)\n- **Critical path: 8 weeks** — FAI/qualification and training run after the longer of material and tooling arrival; values are assumptions until scheduled.\n\n## Maintenance plan\n| Tool | Class | Calib. interval (mo) | PM | Consumables | Spares | Certified by | Cycles/wk added | Cost/yr |\n|---|---|---|---|---|---|---|---|---|\n| FIX-HEX-02 | hex_die | 12.0 | clean + inspect dies weekly; lubricate per instruction sheet | n/a | — | external lab (crimp height gauge traceable) | 30.0 | $120.00 |\n| FIX-SOLD-01 | solder_station | 6.0 | clean + inspect dies w  solder_cup | — | — | solder_class=IPC/WHMA-A-620 class 2; tin_length_mm=3.0 | [unverified: no document] |\n"}, {"path": "tooling_list.md", "name": "tooling_list.md", "group": "Tooling", "ext": "md", "size_kb": 3.8, "content": "# Tooling list — GOLF-RF-2025\n\nPolicy: a tool is compatible if it forms the crimp/joint to the spec's geometry and passes the spec's inspection and pull test. The manufacturer's named tool is the default, not a requirement, at this volume (owner policy, lesson 11).\n\n## PIN-SMA-174 — SMA center pin, crimp, RG174 group\n- Joint: crimp_hex, form **hex**, hex 4.22 mm, wire 0.2 mm² — spec [application spec: SYN-SMA-174, Rev B, table 2]\n- Used on: G-2001; 1 terminations/set; 30 cycles/week at max volume\n- Spec's named tooling: TOOL-SMA-HEX [application spec: SYN-SMA-174, Rev B, table 2]\n- Inventory match:\n  - FIX-HEX-02 (Hex die crimp frame 2.5-6.5 mm hex): **within tolerance — qualify** — hex 4.22 mm within die range\n  - FIX-HT-0640 (Hand crimp tool 0.13-0.5 mm2 F-crimp small pitch): no — form mismatch: tool forms 'F', spec requires 'hex' [application spec: SYN-SMA-174, Rev B, table 2]\n  - FIX-HT-F2 (Hand crimp tool 0.35-2.5 mm2 F-crimp general purpose): no — form mismatch: tool forms 'F', spec requires 'hex' [application spec: SYN-SMA-174, Rev B, table 2]\n  - FIX-4IND-16 (4-indent hand crimp for size-16 machined contacts): no — form mismatch: tool forms 'closed', spec requires 'hex' [application spec: SYN-SMA-174, Rev B, table 2]\n- Paths (one-time cost + labor min/termination):\n  - existing tool FIX-HEX-02 (qualify): $243.20 one-time, 1.5 min/term (qualification 4.0 h loaded; hex 4.22 mm within die range)\n  - buy named tool TOOL-SMA-HEX: $240.00 one-time, 1.5 min/term (budgetary price on file) ← **cheapest compliant path**\n\n## crimp_hex:BNC-STR-58 — crimp_hex\n- Joint: crimp_hex, form **hex**, hex 6.48 mm, wire 0.2 mm² — spec [unverified: no document]\n- Used on: G-2001; 1 terminations/set; 30 cycles/week at max volume\n- Spec's named tooling: none on file — pull the application spec tooling table [unverified: no document]\n- Inventory match:\n  - FIX-HEX-02 (Hex die crimp frame 2.5-6.5 mm hex): **within tolerance — qualify** — hex 6.48 mm within die range\n  - FIX-HT-0640 (Hand crimp tool 0.13-0.5 mm2 F-crimp small pitch): no — form mismatch: tool forms 'F', spec requires 'hex' [unverified: no document]\n  - FIX-HT-F2 (Hand crimp tool 0.35-2.5 mm2 F-crimp general purpose): no — form mismatch: tool forms 'F', spec requires 'hex' [unverified: no document]\n  - FIX-4IND-16 (4-indent hand crimp for size-16 machined contacts): no — form mismatch: tool forms 'closed', spec requires 'hex' [unverified: no document]\n- Paths (one-time cost + labor min/termination):\n  - existing tool FIX-HEX-02 (qualify): $243.20 one-time, 1.5 min/term (qualification 4.0 h loaded; hex 6.48 mm within die range) ← **cheapest compliant path**\n- Qualification required before production — see `qualification_crimp_hex_BNC-STR-58.md`\n\n## solder_cup:DSUB-9S — solder_cup\n- Joint: solder_cup, form **solder**, wire 0.34 mm² — spec [unverified: no document]\n- Used on: G-2002; 3 terminations/set; 90 cycles/week at max volume\n- Spec's named tooling: none on file — pull the application spec tooling table [unverified: no document]\n- Inventory match:\n  - FIX-SOLD-01 (Temperature-controlled solder station 80 W with tips): **exact** — solder joint: FIX-SOLD-01 (Temperature-controlled solder station 80 W with tips) — tip/iron selection per joint size; no crimp geometry applies\n- Paths (one-time cost + labor min/termination):\n  - existing tool FIX-SOLD-01 (exact): $0.00 one-time, 3 min/term (solder joint: FIX-SOLD-01 (Temperature-controlled solder station 80 W with tips) — tip/iron selection per joint size; no crimp geometry applies) ← **cheapest compliant path**\n\n## Tool inventory health (chosen tools)\n- FIX-HEX-02: calibration due 2026-07-01 (interval 12 months)\n- FIX-SOLD-01: calibration due 2026-02-10 (interval 6 month <script>

/* backends: Live talks to the local server; Demo reads data packed into   */

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

const Live = {

  programs: () => api("/api/programs"),
  files: (p) => api(`/api/files?program=${encodeURIComponent(p)}`),
  async fileText(p, path) {
    const r = await fetch(this.fileURL(p, path));
    if (!r.ok) throw new Error("could not read " + path);
    return r.text();
  },
  fileURL: (p, path, dl) =>
    `/api/file?program=${encodeURIComponent(p)}&path=${encodeURIComponent(path)}` +
    (dl ? "&download=1" : ""),
  check: (p) => api("/api/check", {method: "POST",
    body: JSON.stringify({program: p})}),
  generate: (p) => api("/api/generate", {method: "POST",
    body: JSON.stringify({program: p})}),
  confirm: (p, checkpoint, by, notes) => api("/api/confirm", {method: "POST",
    body: JSON.stringify({program: p, checkpoint, by, notes})}),
};

const Demo = {

  canAct: false,
  _prog(p) { return window.DEMO_DATA.programs.find(x => x.id === p); },

  fileText: async function (p, path) {

    return f.content;
  },

    const f = this._prog(p).files.find(x => x.path === path);
    return f && f.b64 ? f.b64 : null;
  },

};

           view: null, lastCheck: {}, currentPath: null, downloads: null};

/* On claude.ai the viewer grants saves through the downloads capability;

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ---- tiny markdown renderer (headings, tables, lists, bold, code) ----- */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  return s;
}
function mdRender(md) {
  const lines = md.split(/\r?\n/);
  let out = [], i = 0, list = false;
  const closeList = () => { if (list) { out.push("</ul>"); list = false; } };
  while (i < lines.length) {
    const ln = lines[i];
    if (/^\s*\|/.test(ln)) {               // table block
      closeList();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push('<div class="tablewrap"><table class="grid">');
      rows.forEach((r, ri) => {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(r)) return;     // separator row
        const cells = r.trim().replace(/^\||\|$/g, "").split("|");
        const tag = ri === 0 ? "th" : "td";
        out.push("<tr>" + cells.map(c =>
          `<${tag}>${mdInline(c.trim())}</${tag}>`).join("") + "</tr>");
      });
      out.push("</table></div>");
      continue;
    }
    if (/^#{1,3} /.test(ln)) { closeList();
      const level = ln.match(/^#+/)[0].length;
      out.push(`<h${level}>${mdInline(ln.replace(/^#+ /, ""))}</h${level}>`);
    } else if (/^\s*[-*] /.test(ln)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push("<li>" + mdInline(ln.replace(/^\s*[-*] /, "")) + "</li>");
    } else if (/^> /.test(ln)) { closeList();
      out.push("<blockquote>" + mdInline(ln.slice(2)) + "</blockquote>");
    } else if (/^---+\s*$/.test(ln)) { closeList(); out.push("<hr>");
    } else if (ln.trim() === "") { closeList();
    } else { closeList(); out.push("<p>" + mdInline(ln) + "</p>"); }
    i++;
  }
  closeList();
  return '<div class="doc">' + out.join("\n") + "</div>";
}

/* ---- CSV ---------------------------------------------------------------*/
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; }
        else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || "").trim() !== "");
}
function csvRender(text) {
  const rows = parseCSV(text);
  if (!rows.length) return '<div class="doc"><p>(empty)</p></div>';
  let h = '<div class="doc" style="max-width:none"><div class="tablewrap"><table class="grid">';
  rows.forEach((r, ri) => {
    const tag = ri === 0 ? "th" : "td";
    h += "<tr>" + r.map(c => `<${tag}>${esc(c)}</${tag}>`).join("") + "</tr>";
  });
  return h + "</table></div></div>";
}

  json:'<svg width="15" height="15" viewBox="0 0 16 16"><path d="M3 1h7l3 3v11H3z" fill="#fff" stroke="#8d8d8d"/><text x="4" y="12" font-size="6.4" font-weight="bold" fill="#8d8d8d" font-family="Tahoma">{ }</text></svg>',
};
const icon = (ext) => ICONS[ext] || ICONS.txt;

/* ---- dialogs -----------------------------------------------------------*/
function dialog(title, html, buttons, ico) {
  $("dlg-title").textContent = title;
  $("dlg-msg").innerHTML = html;
  $("dlg-ico").textContent = ico || "ℹ️";
  const bb = $("dlg-btns"); bb.innerHTML = "";
  (buttons || [{label: "OK"}]).forEach(b => {
    const el = document.createElement("button");
    el.className = "xbtn"; el.style.minWidth = "72px";
    el.textContent = b.label;
    el.onclick = () => { closeDialog(); if (b.onclick) b.onclick(); };
    bb.appendChild(el);
  });
  $("shade").classList.add("show");
  bb.querySelector("button").focus();
}
function closeDialog() { $("shade").classList.remove("show"); }
$("dlg-x").onclick = closeDialog;
$("shade").addEventListener("click", e => {
  if (e.target === $("shade")) closeDialog(); });

const HOWTO_HTML = `
This page is the read-only tour. The live application runs the real engine
(checks, checkpoint confirmations, fresh deliverables) on your computer:<br><br>
1. Get the repository (green <b>Code</b> button → Download ZIP) and unpack it.<br>
2. Install Python 3.11+ from python.org (tick "Add to PATH").<br>
3. Double-click <code>Start Harness Planner.bat</code> (Windows) or
<code>start-harness-planner.command</code> (Mac) inside the
<code>harness-planner</code> folder.<br><br>
The same window opens in your browser, with every button live.`;

/* ---- init --------------------------------------------------------------*/
async function init() {
  try {
    S.programs = await Live.programs();
    S.backend = Live;
  } catch (e) {
    if (window.DEMO_DATA) {
      S.backend = Demo;
      S.programs = await Demo.programs();
    } else {
      $("st-mode").textContent = "no data";
      dialog("Harness Planner", "Could not reach the local server and no " +
        "demo data is packed into this file.<br><br>" + HOWTO_HTML, null, "⚠️");
      return;
    }
  }
  $("st-mode").innerHTML = S.backend === Live
    ? '<span class="sdot" style="background:var(--ok)"></span>Live — engine connected'
    : '<span class="sdot" style="background:var(--warn)"></span>Demo — example data packed in';
  const sel = $("selprog");
  sel.innerHTML = S.programs.map(p =>
    `<option value="${esc(p.id)}">${esc(p.name || p.id)}</option>`).join("");
  sel.onchange = () => openProgram(sel.value);
  if (S.programs.length) openProgram(S.programs[0].id);
  if (S.backend === Demo) {
    ["b-generate", "b-confirm"].forEach(id => $(id).disabled = true);
  }
}

function prog() { return S.programs.find(p => p.id === S.progId); }

async function openProgram(id) {
  S.progId = id;
  $("selprog").value = id;
  $("t-prog").textContent = (prog().name || id);
  try { S.files = await S.backend.files(id); }
  catch (e) { S.files = []; }
  renderTree();
  showHome();
}

/* ---- folders tree ------------------------------------------------------*/
const GROUP_ORDER = ["Reports", "Interpretation", "BOM & parts", "Tooling",
  "Production plan", "Procurement", "Formboards", "Work files", "Other"];
const collapsed = {};

function renderTree() {
  const t = $("tree");
  let h = `<div class="titem" data-view="home">${ICONS.home}<span>Program overview</span></div>`;
  if (S.lastCheck[S.progId]) {
    h += `<div class="titem" data-view="findings">${ICONS.find}<span>Check results</span></div>`;
  }
  const groups = {};
  S.files.forEach(f => (groups[f.group] = groups[f.group] || []).push(f));
  GROUP_ORDER.forEach(g => {
    if (!groups[g]) return;
    const open = !collapsed[g];
    h += `<div class="tgroup" data-group="${esc(g)}"><span class="box">${open ? "−" : "+"}</span>${esc(g)} <span class="tcount">(${groups[g].length})</span></div>`;
    if (open) groups[g].forEach(f => {
      h += `<div class="titem" data-path="${esc(f.path)}" title="${esc(f.name)} — ${f.size_kb} KB">${icon(f.ext)}<span>${esc(f.name)}</span></div>`;
    });
  });
  if (!S.files.length) {
    h += `<div style="padding:10px;color:#9a968c">No deliverables yet.<br>Use <b>Generate deliverables</b>.</div>`;
  }
  t.innerHTML = h;
  t.querySelectorAll(".titem").forEach(el => el.onclick = () => {
    t.querySelectorAll(".titem.sel").forEach(x => x.classList.remove("sel"));
    el.classList.add("sel");
    if (el.dataset.view === "home") showHome();
    else if (el.dataset.view === "findings") showFindings();
    else openFile(el.dataset.path);
    if (innerWidth <= 700) $("sidebar").classList.remove("open");
  });
  t.querySelectorAll(".tgroup").forEach(el => el.onclick = () => {
    collapsed[el.dataset.group] = !collapsed[el.dataset.group];
    renderTree();
  });
}

function setAddr(leaf) {
  const p = prog();
  $("addr").textContent =
    `C:\\Program Files\\Harness Planner\\${(p && (p.name || p.id)) || ""}` +
    (leaf ? "\\" + leaf.replaceAll("/", "\\") : "");
}

/* ---- views -------------------------------------------------------------*/
function showHome() {
  const p = prog(); if (!p) return;
  S.currentPath = null;
  setAddr("");
  $("st-file").textContent = "";
  const cps = p.checkpoints || {};
  const cpRow = (name) => {
    const c = cps[name] || {};
    const ok = c.status === "confirmed";
    return `<div class="cprow"><span class="nm">${esc(name)}</span>
      <span class="badge ${ok ? "ok" : "pend"}">${ok ? "CONFIRMED" : "PENDING"}</span>
      <span style="color:var(--ink-soft)">${ok ? esc((c.by || "") + (c.date ? " · " + c.date.slice(0, 10) : "")) : esc(c.notes || "waiting for the owner")}</span>
      ${S.backend.canAct && !ok ? `<button class="xbtn" data-cp="${esc(name)}">Confirm…</button>` : ""}
      </div>`;
  };
  const chk = S.lastCheck[S.progId];
  const sevCount = (sev) => chk ? chk.findings.filter(f => f.severity === sev).length : "–";
  $("viewer").innerHTML = `
  <div class="home">
    <div class="hcard"><div class="hhdr">Program</div><div class="hbody">
      <dl class="kv">
        <dt>Program</dt><dd><b>${esc(p.name || p.id)}</b> rev ${esc(p.revision || "–")} · ${esc(p.date || "")}</dd>
        <dt>Customer</dt><dd>${esc(p.customer || "–")}</dd>
        <dt>Volumes</dt><dd>${esc((p.volumes || []).join(", "))} <b>${esc(p.volume_unit || "")}</b> planned · with upper limits: ${esc((p.planned_volumes || []).join(", "))}</dd>
        <dt>Harnesses</dt><dd>${(p.harnesses || []).map(h =>
          `${esc(h.drawing)} ${esc(h.name)} (×${h.qty_per_set}/set)`).join("<br>")}</dd>
      </dl>
    </div></div>
    <div class="hcard"><div class="hhdr">Findings ${chk ? "" : "— run checks to fill in"}</div><div class="hbody counts">
      <div class="cnt blocker"><b>${sevCount("blocker")}</b>blockers</div>
      <div class="cnt warning"><b>${sevCount("warning")}</b>warnings</div>
      <div class="cnt info"><b>${sevCount("info")}</b>info</div>
      <div class="cnt"><b>${chk ? chk.additions.length : "–"}</b>parts added by spec</div>
    </div></div>
    <div class="hcard"><div class="hhdr">Checkpoints — gates before costing, ordering and board release</div>
      <div class="hbody cps">
        ${["CONFIRM_ARCHITECTURE", "CONFIRM_VOLUME_UNITS", "RESOLVE_BLOCKERS", "VALIDATE_FIRST_BOARD"].map(cpRow).join("")}
      </div></div>
  </div>`;
  $("viewer").querySelectorAll("[data-cp]").forEach(b =>
    b.onclick = () => confirmDialog(b.dataset.cp));
}

function showFindings() {
  const chk = S.lastCheck[S.progId]; if (!chk) return;
  S.currentPath = null;
  setAddr("check results");
  const order = {blocker: 0, warning: 1, info: 2};
  const rows = [...chk.findings].sort((a, b) =>
    (order[a.severity] - order[b.severity]) || a.id.localeCompare(b.id));
  let h = `<div class="vtool"><span class="fname">Check results</span>
    <span class="meta">${rows.length} findings · ${chk.additions.length} spec-cascaded parts${S.backend === Demo ? " · pre-computed for the demo" : ""}</span></div>
    <div class="doc" style="max-width:none"><div class="tablewrap"><table class="grid">
    <tr><th>ID</th><th>Severity</th><th>Harness</th><th>Finding</th><th>Source</th><th>Proposed default</th></tr>`;
  rows.forEach(f => {
    h += `<tr><td>${esc(f.id)}</td><td><span class="sev ${esc(f.severity)}">${esc(f.severity.toUpperCase())}</span></td>
      <td>${esc(f.harness || "—")}</td><td>${esc(f.message)}</td>
      <td>${esc(f.source || "")}</td><td>${esc(f.proposed_default || "—")}</td></tr>`;
  });
  h += `</table></div><h2>Parts the specs require that the drawing/BOM omitted</h2>
    <div class="tablewrap"><table class="grid">
    <tr><th>Harness</th><th>Part</th><th>Qty/harness</th><th>Required by</th><th>Rule</th><th>Source</th><th>Status</th></tr>`;
  chk.additions.forEach(a => {
    h += `<tr><td>${esc(a.harness)}</td><td>${esc(a.mpn)}</td><td>${a.qty_per_harness}</td>
      <td>${esc(a.required_by)}</td><td>${esc(a.when)}</td><td>${esc(a.source)}</td><td>${esc(a.note)}</td></tr>`;
  });
  h += "</table></div></div>";
  $("viewer").innerHTML = h;
}

const canDownload = () =>
  S.backend === Live || location.protocol === "file:" || !!S.downloads;

async function openFile(path) {
  const f = S.files.find(x => x.path === path); if (!f) return;
  S.currentPath = path;
  setAddr(f.name);
  $("st-file").textContent = `${f.name} — ${f.size_kb} KB`;
  const v = $("viewer");
  let tool = `<div class="vtool"><span class="fname">${icon(f.ext)} ${esc(f.name)}</span>
    <span class="meta">${f.size_kb} KB</span>`;
  if (canDownload()) tool += `<button class="xbtn" id="v-dl">Save a copy…</button>`;
  const isSvg = f.ext === "svg";
  if (isSvg) tool += `<span class="tsep"></span>
    <button class="xbtn" data-z="out">−</button>
    <button class="xbtn" data-z="fit">Fit width</button>
    <button class="xbtn" data-z="in">+</button>
    <button class="xbtn" data-z="100">1:1 (true scale ≈ screen dependent)</button>`;
  tool += "</div>";

  if (["xlsx", "pdf", "png"].includes(f.ext)) {
    v.innerHTML = tool + `<div class="binmsg">${icon(f.ext)}<br><br>
      <b>${esc(f.name)}</b> is a binary file (${f.ext.toUpperCase()}).<br>
      ${canDownload() ? "Use <b>Save a copy…</b> to open it in its own program."
        : "Open the live app on your computer to save it (Help → How to run the live app)."}</div>`;
    hookDownload(f);
    return;
  }
  let text;
  try { text = await S.backend.fileText(S.progId, path); }
  catch (e) {
    v.innerHTML = tool + `<div class="binmsg">This file is not packed into the
      demo. Run the live app to open it.</div>`;
    return;
  }
  if (f.ext === "md") v.innerHTML = tool + mdRender(text);
  else if (f.ext === "csv") v.innerHTML = tool + csvRender(text);
  else if (isSvg) {
    v.innerHTML = tool + `<div class="svgwrap" id="svgwrap">${text.replace(/^[\s\S]*?<svg/, "<svg")}</div>`;
    initSvgZoom();
  } else v.innerHTML = tool + `<pre class="plain">${esc(text)}</pre>`;
  hookDownload(f, text);
}

function demoBytes(f, text) {
  if (text != null) return text;
  const b64 = Demo.fileB64 && Demo.fileB64(S.progId, f.path);
  if (!b64) return null;
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

function hookDownload(f, text) {
  const b = $("v-dl"); if (!b) return;
  b.onclick = async () => {
    const fname = f.name.split("/").pop();
    if (S.backend === Live) {
      location.href = Live.fileURL(S.progId, f.path, true);
      return;
    }
    const data = demoBytes(f, text);
    if (data == null) {
      dialog("Save a copy", "This file is not packed into the demo.", null, "⚠️");
      return;
    }
    if (S.downloads) {               // claude.ai viewer: capability save
      try { await S.downloads.save({filename: fname, data}); }
      catch (e) {
        if (e && e.code !== "declined")
          dialog("Save a copy", "Could not save: " + esc(e.message || e.code),
                 null, "⚠️");
      }
      return;
    }
    const blob = data instanceof Uint8Array ? new Blob([data])
      : new Blob([data], {type: "text/plain"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
}

function initSvgZoom() {
  const wrap = $("svgwrap"); if (!wrap) return;
  const svg = wrap.querySelector("svg"); if (!svg) return;
  const vb = (svg.getAttribute("viewBox") || "0 0 2400 1200").split(/\s+/);
  const natW = parseFloat(vb[2]) || 2400;
  let scale;
  const apply = () => { svg.style.width = (natW * scale) + "px"; svg.style.height = "auto"; };
  const fit = () => { scale = (wrap.clientWidth - 30) / natW; apply(); };
  fit();
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    if (b.dataset.z === "in") scale *= 1.3;
    else if (b.dataset.z === "out") scale /= 1.3;
    else if (b.dataset.z === "100") scale = 3.7795; /* ~96dpi px per mm */
    else { fit(); return; }
    apply();
  });
}

/* ---- actions -----------------------------------------------------------*/
async function runChecks() {
  try {
    const res = await S.backend.check(S.progId);
    S.lastCheck[S.progId] = res;
    const n = (s) => res.findings.filter(f => f.severity === s).length;
    $("st-findings").textContent =
      `${n("blocker")} blockers · ${n("warning")} warnings · ${n("info")} info`;
    renderTree();
    showFindings();
  } catch (e) { dialog("Run checks", esc(e.message), null, "⚠️"); }
}

async function runGenerate() {
  if (!S.backend.canAct) return demoNote("Generate deliverables");
  $("b-generate").disabled = true;
  $("st-file").textContent = "generating… (formboards, costing, procurement)";
  try {
    const res = await S.backend.generate(S.progId);
    S.files = await S.backend.files(S.progId);
    renderTree();
    let msg = "<b>Produced:</b><br>" + res.produced.map(esc).join("<br>");
    if (res.withheld.length) {
      msg += "<br><br><b>Withheld (checkpoint gates):</b><br>" +
        res.withheld.map(esc).join("<br>");
    }
    dialog("Generate deliverables", msg, null, "✅");
  } catch (e) { dialog("Generate deliverables", esc(e.message), null, "⚠️"); }
  $("b-generate").disabled = false;
  $("st-file").textContent = "";
}

function confirmDialog(preselect) {
  if (!S.backend.canAct) return demoNote("Confirm checkpoint");
  const cps = ["CONFIRM_ARCHITECTURE", "CONFIRM_VOLUME_UNITS",
               "RESOLVE_BLOCKERS", "VALIDATE_FIRST_BOARD"];
  dialog("Confirm checkpoint", `
    <div class="frm">
      <label for="cp-sel">Checkpoint</label>
      <select class="xsel" id="cp-sel" style="max-width:none">${cps.map(c =>
        `<option ${c === preselect ? "selected" : ""}>${c}</option>`).join("")}</select>
      <label for="cp-by">Confirmed by (required)</label>
      <input type="text" id="cp-by" placeholder="your name">
      <label for="cp-notes">Notes</label>
      <input type="text" id="cp-notes" placeholder="e.g. volumes are sets, not harnesses">
      <div style="color:var(--ink-soft)">A checkpoint records a decision a
      person made — it is never confirmed automatically.</div>
    </div>`,
    [{label: "Confirm", onclick: async () => {
      try {
        const cp = $("cp-sel").value, by = $("cp-by").value,
              notes = $("cp-notes").value;
        const cps2 = await S.backend.confirm(S.progId, cp, by, notes);
        prog().checkpoints = cps2;
        showHome();
      } catch (e) { dialog("Confirm checkpoint", esc(e.message), null, "⚠️"); }
    }}, {label: "Cancel"}], "✔️");
}

function demoNote(what) {
  dialog(what, `This page is the <b>demo</b> — it shows real generated
    outputs, but actions run only in the live app on your computer.<br><br>`
    + HOWTO_HTML, null, "ℹ️");
}

/* ---- chrome wiring -----------------------------------------------------*/
$("b-check").onclick = runChecks;
$("b-generate").onclick = runGenerate;
$("b-confirm").onclick = () => confirmDialog();
$("b-folders").onclick = () => {
  const sb = $("sidebar");
  if (innerWidth <= 700) sb.classList.toggle("open");
  else sb.style.display = (sb.style.display === "none" ? "" : "none");
};
$("b-max").onclick = () => $("win").classList.toggle("maxi");
$("b-min").onclick = () => {
  ["menubar", "toolbar", "main", "statusbar", "addressbar"].forEach(id => {
    const el = $(id); if (el) el.hidden = !el.hidden; });
};
$("b-close").onclick = () => dialog("Harness Planner XP",
  "It is now safe to close this browser tab.", null, "💾");

document.querySelectorAll("[data-menu]").forEach(m => {
  m.querySelector("button").onclick = (e) => {
    e.stopPropagation();
    const was = m.classList.contains("open");
    document.querySelectorAll(".menu.open").forEach(x => x.classList.remove("open"));
    if (!was) m.classList.add("open");
  };
});
document.addEventListener("click", () =>
  document.querySelectorAll(".menu.open").forEach(x => x.classList.remove("open")));
document.querySelectorAll(".mi[data-act]").forEach(mi => {
  mi.addEventListener("click", () => {
    const act = mi.dataset.act;
    if (act === "focus-program") $("selprog").focus();
    else if (act === "download") { const b = $("v-dl"); if (b) b.click();
      else dialog("Save current file", "Open a file first.", null, "ℹ️"); }
    else if (act === "close") $("b-close").onclick();
    else if (act === "check") runChecks();
    else if (act === "generate") runGenerate();
    else if (act === "confirm") confirmDialog();
    else if (act === "toggle-folders") $("b-folders").onclick();
    else if (act === "home") showHome();
    else if (act === "howto") dialog("How to run the live app", HOWTO_HTML, null, "🛠️");
    else if (act === "about") dialog("About Harness Planner XP",
      `<b>Harness Planner XP</b><br>version 0.1 — the clickable face of the
      harness-planner engine.<br><br>It reads one structured program file,
      runs the rules engine (BOM reconciliation, compatibility, accessory
      cascade, tooling reuse) and generates every deliverable: BOMs,
      termination maps, tooling lists, line plans, costing workbooks,
      procurement lists and true-scale formboards.<br><br>
      All example data is synthetic.`, null, "🔌");
  });
});

init();
</script>
